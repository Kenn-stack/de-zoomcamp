services:
  pgdatabase:
    image: postgres:18
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=ny_taxi
    ports:
      - "5432:5432"
    networks:    # <--- Assign service to network
      - pg-network

  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=root
    ports:
      - "8085:80"
    networks:    # <--- Assign service to network
      - pg-network

# Define the network globally
networks:
  pg-network:
    driver: bridge
    name: pg-network  # <--- Forces the actual name to be 'pg-network'